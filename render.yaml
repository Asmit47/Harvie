services:
  - type: web
    name: harvie-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn harvie.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: harvie-db
          property: connectionString
      - key: HARVIE_API_PROXY_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPERMEMORY_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_USER_ID
        sync: false
      - key: HARVIE_ALLOWED_ORIGINS
        sync: false

databases:
  - name: harvie-db
    plan: free
    databaseName: harvie
    user: harvie

